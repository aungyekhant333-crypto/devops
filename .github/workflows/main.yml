name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Temurin 25.0.2
        uses: actions/setup-java@v2
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo
          for i in $(seq 1 30); do
            docker exec mongo-dbserver mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            sleep 2
          done
      - name: Build with Maven
        run: mvn package
      - name: Build
        run: docker build -t se-methods .
      - name: Run image
        run: |
          MONGO_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mongo-dbserver)
          docker run --network se-methods --add-host mongo-dbserver:${MONGO_IP} --name devops se-methods
      - name: view logs
        run: docker logs devops